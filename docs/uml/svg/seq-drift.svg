 #A80036; stroke-width: 1.0;" x1="955" x2="1398.5" y1="460.7109" y2="460.7109"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="267" x="962" y="455.645">alert (&lt; 60 s) with services, locations, why</text><line style="stroke: #000000; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="467" x2="1441" y1="469.7109" y2="469.7109"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="62" x="472" y="479.9214">[additive]</text><line style="stroke: #A80036; stroke-width: 1.0;" x1="549" x2="591" y1="504.6484" y2="504.6484"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="591" x2="591" y1="504.6484" y2="517.6484"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="550" x2="591" y1="517.6484" y2="517.6484"/><polygon fill="#A80036" points="560,513.6484,550,517.6484,560,521.6484,556,517.6484" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="98" x="556" y="499.5825">record, no alert</text><!--MD5=[65f0c6a47c003fd832bb4a89b10b07a2]
@startuml seq-drift
title Schema-drift guard: detect, map, explain

skinparam shadowing false
queue "Kafka topic\n(e.g. runs.events)" as K
participant "Sampler (Go)\nread-only group" as S
participant "Schema inferencer" as I
participant "Code index\n(tree-sitter)" as CI
participant "Explainer (Py)" as E
participant "LLM" as LLM
actor "On-call" as OC

K -> S : sample messages (<1% throughput)
S -> I : field stats over rolling window
I -> I : infer schema (presence >99.9% = required)
I -> I : diff vs previous window
alt breaking change
  I -> CI : lookup field_path across consumer repos
  CI - -> I : services + file:line
  I -> E : diff + schemas + matched snippets
  E -> LLM : write explanation (deterministic match, LLM only explains)
  LLM - -> E : alert text
  E -> OC : alert (< 60 s) with services, locations, why
else additive
  I -> I : record, no alert
end
@enduml

